[project]
name = "aughor"
version = "0.1.0"
description = "Autonomous Data Analyst — investigative agent over your warehouse"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sidha Sadhak" }]
keywords = ["sql", "llm", "agent", "data-analysis", "nl2sql", "duckdb", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.50.0",
    "instructor>=1.4.0",
    "duckdb>=1.1.0",
    # scipy stays: `tools/stats.py` imports it at module level and is imported at module
    # level by agent/explore.py, nodes.py and investigate.py — it is on the ANALYSIS path,
    # even though it is absent from the API's boot closure.
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "sqlglot>=25.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "cryptography>=48.0.0",
    "psycopg2-binary>=2.9.12",
    "pyyaml>=6.0.3",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.0",
    "pytz>=2024.1",
    "mcp>=1.28.0",
    "ag-ui-protocol==0.1.19",
]

[project.optional-dependencies]
# ── Weight moved OFF the serving path (measured 2026-08-05) ────────────────────────────
# The development environment is ~1.1 GB, but importing `aughor.api` and diffing
# sys.modules shows the API's boot closure is 121 MB and a clean serving install 102 MB.
# The bulk sat in dependencies nothing on the request path imports. Splitting them out
# makes a ~110 MB deployment real rather than theoretical, and each extra below is
# guarded so a missing one degrades with a clear message instead of an ImportError.
#
#   deleted outright: statsmodels (36 MB) — imported by ZERO modules.
#   kept:             scipy — on the analysis path via tools/stats.py.
#
# `polars` is 192 MB and pulls `pyarrow` (120 MB) to serve ONE call site
# (`db/connection.py`), which already falls back to DuckDB on ImportError — so the
# fast bulk-read path is an optimisation, not a requirement. `connectorx` (113 MB) is
# its partner and already lives in [warehouse].
fastread = [
    "polars>=1.0.0",
]
# Semantic search / RAG. `qdrant-client` is 3 MB but drags 39 MB of grpc, and it already
# needs a Qdrant server (`AUGHOR_QDRANT_URL`, default localhost:6333) — so a deployment
# without that server carries 42 MB for a feature it cannot use. Every entry point in
# `semantic/vector_store.py` checks `available()` and degrades to "empty index": reads
# return nothing, writes no-op. A CONNECTION failure still raises, because a configured
# index that is down is an outage worth surfacing, not a silent no-op.
semantic = [
    "qdrant-client>=1.9.0",
]
# PDF/PPTX rendering. Reached only through `from aughor.export import export_report`
# inside a router handler, never at import time.
export = [
    "reportlab>=4.5.1",
    "python-pptx>=1.0.2",
    "matplotlib>=3.11.0",
]
docs = [
    "pypdf>=6.4.0",
    "python-docx>=1.0.0",
]
warehouse = [
    "ibis-framework[duckdb,postgres]>=9.0.0",
    "connectorx>=0.3.3",
    "google-cloud-bigquery>=3.0.0",
    "snowflake-connector-python>=3.0.0",
    "PyMySQL>=1.0.0",
]
crm = [
    "stripe>=7.0.0",
    "hubspot-api-client>=8.0.0",
    "simple-salesforce>=1.12.0",
]
cloud-storage = [
    "azure-storage-blob>=12.0.0",
]
knowledge-sync = [
    "atlassian-python-api>=3.41.0",
    "notion-client>=2.2.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-anyio>=0.0.0",
]
observability = [
    # Upper-bounded on purpose (OA·LF-1). The old `>=2.0.0` resolved to 4.x, whose
    # client dropped every v2 method telemetry.py called — init still succeeded, so
    # the backend reported enabled and shipped nothing for as long as that pin stood.
    # Spans now travel over OTLP, so the SDK is only used for its documented
    # trace-id seeding; `tests/unit/test_telemetry_sdk_surface.py` fails loudly if a
    # future major moves either that or the OTel attribute keys.
    "langfuse>=4,<5",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    # obs.mlflow feature flag — MLflow trace trees per investigation (≥3.13 for
    # the OSS RBAC/archival-era client; 3.9.0 had a Postgres+S3 trace bug).
    # Skinny on purpose: the full `mlflow` server distribution pins pandas<3 /
    # older cryptography, which would downgrade the whole lock (CVE-audit
    # regressions). The server runs in Docker; the app only needs the client.
    "mlflow-skinny>=3.13",
]
evals = [
    "braintrust>=0.0.150",
    "autoevals>=0.0.70",
]

[project.urls]
Homepage = "https://github.com/sidhasadhak/aughor"
Repository = "https://github.com/sidhasadhak/aughor"
Issues = "https://github.com/sidhasadhak/aughor/issues"

[project.scripts]
aughor = "aughor.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that require a live LLM (deselect with -m 'not e2e')",
    "eval: delta-ratchet accuracy/compute evals that require a live LLM (run with -m eval)",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["web", "evals/spider2*"]

[tool.ruff.lint]
# Enforce pyflakes (real problems: unused imports/vars, undefined names, redefinitions)
# plus the default bug-ish pycodestyle checks. The style rules below clash with
# deliberate, pervasive codebase conventions and would be WRONG to mass-rewrite, so
# they are disabled rather than "fixed":
#   E402 — intentional lazy / mid-module imports (cycle avoidance)
#   E701 / E702 — one-line guards (`if x: return`, `a; b`)
#   E731 — assigned lambdas
#   E741 — short loop/lambda names (l, I, O)
ignore = ["E402", "E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export their package's public API; the imports are
# intentional even though unused *within* the file.
"__init__.py" = ["F401"]

[tool.hatch.build.targets.wheel]
packages = ["aughor"]

[tool.vercel]
# Stated explicitly because autodetection cannot choose: every FastAPI router test
# builds its own `app` for its TestClient, so a dozen files under tests/ look like
# candidate entrypoints. The served application is the one in aughor/api.py.
entrypoint = "aughor.api:app"
