id: grr-falls-read-by-segment-and-cohort
kind: diagnostic
trigger_metric: gross_revenue_retention
trigger_condition: gross revenue retention falls period over period
trigger_operator: lt
recommendation: >
  Gross retention falls only when accounts leave or shrink, so read it by segment and by cohort before reading the
  total: the published medians run from the low eighties for the smallest contracts to the mid nineties above
  $250k ACV, and a book whose mix shifted toward small contracts reads worse at unchanged behaviour. Then read the
  cohort by age — a first-renewal cohort leaves at several times the rate of a third-year one — and name the
  accounts behind the loss; in a B2B book a handful of accounts usually carries most of it.
expected_impact: The loss is placed in a segment and a cohort and the accounts behind it are named.
owner_role: Customer Success
tags: [gross revenue retention, churn, segment, cohort]
sources: [saas-capital-retention-2025, benchmarkit-2025]
