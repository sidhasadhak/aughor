id: activation-falls-by-channel-and-plan
kind: diagnostic
trigger_metric: activation_rate
trigger_condition: the activation rate falls period over period
trigger_operator: lt
recommendation: >
  Check the milestone first: a changed activation definition moves the rate with no change in the product. Then
  read the rate by channel and by plan — a paid campaign that brought many signups of the wrong kind lowers the
  rate while raising the count — and give the youngest cohort the days the milestone usually takes before reading
  it as fallen. Sales-led signups activate at a higher rate than product-led ones in the published figures; a mix
  shift between them reads as a change in the product.
expected_impact: The fall is attributed to the definition, the signup mix or the product, with the channel named.
owner_role: Product
tags: [activation, onboarding, signups]
sources: [userpilot-activation-2024]
