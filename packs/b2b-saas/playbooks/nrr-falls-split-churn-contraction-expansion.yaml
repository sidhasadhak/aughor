id: nrr-falls-split-churn-contraction-expansion
kind: diagnostic
trigger_metric: net_revenue_retention
trigger_condition: net revenue retention falls period over period
trigger_operator: lt
recommendation: >
  Split the fall into its three movements before naming a cause: churned MRR, contraction MRR and expansion MRR
  over the same cohort. Churn rising points at accounts leaving — read it by segment and by cohort age, since the
  first renewal is where most logos leave; contraction rising points at seats or tiers coming down, often one
  segment repricing; expansion falling points at the sales motion, not the product. Then read the cohort's size:
  a small cohort moves the ratio on one account.
expected_impact: The fall is attributed to churn, contraction or expansion, each with a segment and an owner.
owner_role: Customer Success
tags: [net revenue retention, churn, expansion, contraction]
sources: [saas-capital-retention-2025, chartmogul-retention-2025]
