id: margin-falls-split-yield-and-funding-cost
kind: diagnostic
trigger_metric: net_interest_margin
trigger_condition: net interest margin falls period over period
trigger_operator: lt
recommendation: >
  Split the fall into the yield on earning assets and the cost of funding them before naming a cause: the margin is
  their difference over the same average earning assets. A falling yield points at assets repricing, a shift in the
  mix (cash building up earns little) or loans moving to nonaccrual; a rising cost points at deposits repricing or
  funding moving from noninterest-bearing deposits to time deposits and borrowings.
expected_impact: The fall is attributed to the asset side or the funding side, each with an owner.
owner_role: Treasury
tags: [net interest margin, funding cost, asset yield]
sources: [fdic-qbp-notes-2025-q2]
