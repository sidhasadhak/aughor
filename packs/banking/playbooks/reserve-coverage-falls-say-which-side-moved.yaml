id: reserve-coverage-falls-say-which-side-moved
kind: diagnostic
trigger_metric: reserve_coverage_ratio
trigger_condition: reserve coverage ratio falls period over period
trigger_operator: lt
recommendation: >
  Coverage is the allowance over noncurrent loans, so say which side moved: noncurrent loans growing faster than the
  allowance, or charge-offs drawing the allowance down. The same coverage can describe a larger allowance against a
  larger problem book.
expected_impact: A fall in coverage is read as more problem loans or a thinner allowance, not as one number.
owner_role: Credit Risk
tags: [reserve coverage, allowance for credit losses, noncurrent loans]
sources: [fdic-qbp-notes-2025-q2]
