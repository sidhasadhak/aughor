# Goldens on the FDIC's June 30, 2025 per-institution data: each reproduces a figure the FDIC published for the
# same institutions. Published to two decimals of a percent, so the tolerance is ±0.005 points. Return on assets,
# net charge-offs to loans and the equity capital ratio come as the second quarter 2026 profile restates them; the
# other all-institution figures as first published, which the amendments since left inside their rounding.
# Return on equity, the efficiency ratio and reserve coverage have no golden: the amendments moved them past the
# rounding of their only publication, and the profile does not restate them — gate 4 holds them to their band.
