name: reserve_coverage_ratio
title: Reserve coverage ratio
aliases: [coverage ratio, reserve coverage, allowance to noncurrent loans]
unit: ratio
definition: >
  The allowance for credit losses on loans and leases as a share of noncurrent loans and leases, at the end of the
  period.
formula: >
  SUM({{role.financial_period.allowance_for_credit_losses}})
    / NULLIF(SUM({{role.financial_period.noncurrent_loans}}), 0)
grain: >
  An entity's balances at the end of a period, summed over the entities, then divided; read by peer group, size or
  date by filtering the same rows, never by averaging the entities' ratios.
binds:
  required: [financial_period]
anti_patterns:
  - "Comparing coverage across the adoption of current expected credit loss accounting without marking the break."
  - "Reading an entity with almost no noncurrent loans: its coverage runs to thousands of percent and says nothing."
sane_range:
  min: 1.06405
  max: 3.94925
  basis: >
    The FDIC's asset concentration groups and asset size groups of insured institutions, second quarters of 2025 and
    2026: from Less than $100 million 106.41% (June 30, 2026) to Credit card banks 394.92% (June 30, 2026), widened
    by the ±0.005 points of their two-decimal rounding. A single institution can sit outside a group's rate.
  sources: [fdic-qbp-2025-q2, fdic-qbp-2026-q2]
