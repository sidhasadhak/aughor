name: noncurrent_loan_rate
title: Noncurrent loan rate
aliases: [noncurrent rate, noncurrent loan rate, noncurrent loans to loans]
unit: ratio
definition: >
  Loans and leases 90 days or more past due or in nonaccrual status, as a share of loans and leases, at the end of
  the period.
formula: >
  SUM({{role.financial_period.noncurrent_loans}})
    / NULLIF(SUM({{role.financial_period.total_loans}}), 0)
grain: >
  An entity's balances at the end of a period, summed over the entities, then divided; read by peer group, size or
  date by filtering the same rows, never by averaging the entities' ratios.
binds:
  required: [financial_period]
anti_patterns:
  - "Counting accounts instead of balances."
  - "Reading a falling rate as better credit without the charge-offs: loans leave the noncurrent book when they are charged off, too."
sane_range:
  min: 0.00455
  max: 0.01565
  basis: >
    The FDIC's asset concentration groups and asset size groups of insured institutions, second quarters of 2025 and
    2026: from Mortgage lenders 0.46% (June 30, 2026) to Credit card banks 1.56% (June 30, 2025), widened by the
    ±0.005 points of their two-decimal rounding. A single institution can sit outside a group's rate.
  sources: [fdic-qbp-2025-q2, fdic-qbp-2026-q2]
