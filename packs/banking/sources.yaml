  - id: fdic-qbp-notes-2025-q2
    title: "Quarterly Banking Profile: Notes to Users, Second Quarter 2025"
    publisher: Federal Deposit Insurance Corporation
    url: https://www.fdic.gov/quarterly-banking-profile/qbp-notes-users-second-quarter-2025.pdf
    published: 2025-08-26
    retrieved: 2026-09-17
    notes: >
      The definitions every recipe follows, quoted: 'All condition and performance ratios represent weighted
      averages, which is the sum of the individual numerator values divided by the sum of individual denominator
      values. All asset and liability figures used in calculating performance ratios represent average amounts for
      the period (beginning-of-period amount plus end-of-period amount plus any interim periods, divided by the
      total number of periods).' 'Net interest margin – the difference between interest and dividends earned on
      interest-bearing assets and interest paid to depositors and other creditors, expressed as a percentage of
      average earning assets. No adjustments are made for interest income that is tax exempt.' 'Yield on earning
      assets – total interest, dividend, and fee income earned on loans and investments as a percentage of average
      earning assets.' 'Cost of funding earning assets – total interest expense paid on deposits and other borrowed
      money as a percentage of average earning assets.' 'Efficiency ratio – noninterest expense less amortization of
      intangible assets as a percent of net interest income plus noninterest income.' 'Return on assets – bank net
      income (including gains or losses on securities and extraordinary items) as a percentage of average total
      (consolidated) assets.' 'Return on equity – bank net income (including gains or losses on securities and
      extraordinary items) as a percentage of average total equity capital.' 'Net charge-offs – total loans and
      leases charged off (removed from balance sheet because of uncollectability), less amounts recovered on loans
      and leases previously charged off.' 'Noncurrent loan rates represent the percentage of loans in each category
      that are past due 90 days or more or that are in nonaccrual status.' 'Earning assets – all loans and other
      investments that earn interest or dividend income.'
