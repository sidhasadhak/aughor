# Arc MC (ROADMAP §3.62) — the areas marketing's knowledge-base patterns are read on. An industry pack takes one into its
# own area by naming it in `absorbs`; an area no industry takes is read under its own name.
areas:
  - id: marketing
    name: Marketing
    question: What did growth cost?
    words: [marketing, campaign, attribution, advert, advertising, ads, spend, impression, roas]
  - id: acquisition
    name: Acquisition
    question: What does a new customer cost?
    words: [acquisition, lead, leads, signup]
  - id: crm
    name: CRM
    question: Do our messages land?
    words: [email, newsletter, sms, push notification]
  - id: promotions
    name: Promotions
    question: Do discounts pay?
    words: [voucher, coupon, promo, promotion, discount]
