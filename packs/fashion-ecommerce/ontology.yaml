# Extends core-ecommerce: inherits its objects, links, lifecycles and aliases; adds what
# fashion has. An entry with a core name would replace the core's — none does here.
objects:
  - name: Brand
    roles: [catalog]
    aliases: [brands, brand, labels, designers]
  - name: Season
    roles: [calendar]
    aliases: [seasons, season, collections_seasons]
  - name: Collection
    roles: [catalog]
    aliases: [collections, collection, drops]
  - name: Variant
    roles: [catalog]
    aliases: [variants, product_variants, sizes, skus_by_size]
links:
  - {from_object: Product,   to_object: Brand,  cardinality: "N:1", via: brand_id}
  - {from_object: Product,   to_object: Season, cardinality: "N:1", via: season}
  - {from_object: OrderItem, to_object: Brand,  cardinality: "N:1", via: brand, description: often denormalised onto the line}
  - {from_object: Variant,   to_object: Product, cardinality: "N:1", via: product_id}
aliases:
  - {field: brand_tier, values: {}}
  - {field: size,       values: {}}
